<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ヨーロッパ制覇クエスト</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b1530;color:#e8f0ff;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;font-weight:700}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#0b1530 0%,#102047 100%)}

  /* ===== TOP HUD ===== */
  .hud{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(0,0,0,0.25);backdrop-filter:blur(8px);border-bottom:2px solid rgba(255,255,255,0.06);flex-wrap:wrap;min-height:64px}
  .hud .title{font-size:18px;color:#7fb6ff;letter-spacing:1px}
  .hud .prompt{flex:1;text-align:center;font-size:28px;color:#fff}
  .hud .prompt .target{display:inline-block;padding:6px 18px;border-radius:12px;background:linear-gradient(135deg,#ffd64d,#ff8a3d);color:#1a1133;box-shadow:0 4px 12px rgba(255,170,80,0.5);margin:0 6px;font-size:32px}
  .hud .stat{display:flex;flex-direction:column;align-items:center;min-width:78px;padding:4px 8px;background:rgba(255,255,255,0.06);border-radius:10px}
  .hud .stat .label{font-size:11px;color:#9fc1ff;opacity:0.9}
  .hud .stat .value{font-size:20px;color:#fff;font-variant-numeric:tabular-nums}
  .hud .stat.streak .value{color:#ffd64d}
  .hud .stat.timer .value{color:#7fffd4}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:12px;border:none;background:linear-gradient(135deg,#4d6dff,#3a4ed1);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.3);min-height:48px;font-family:inherit}
  .btn:active{transform:translateY(1px) scale(0.98)}
  .btn.ghost{background:rgba(255,255,255,0.1)}
  .btn.danger{background:linear-gradient(135deg,#ff5a73,#d63a52)}

  /* ===== MAP ===== */
  #stage{flex:1;position:relative;overflow:hidden}
  #map{width:100%;height:100%;display:block;touch-action:manipulation;transition:none}

  .country{fill:#2a3a6b;stroke:#5070a5;stroke-width:1.2;transition:fill 0.18s,stroke 0.18s}
  .country.bg{fill:#1a274d;stroke:#3a527d;stroke-width:0.8;opacity:0.85}
  .country.target{cursor:pointer;fill:#324a85;stroke:#7ea0d8;stroke-width:1.4}
  .country.target.pressing{fill:#5a7dcc;stroke:#ffd64d;stroke-width:2}
  .country.hint{fill:#3d57a3;stroke:#ffd64d;stroke-width:2.5}
  .country.target-highlight{fill:#ffd07a !important;stroke:#ff8a3d;stroke-width:3;animation:targetPulse 1.4s ease-in-out infinite}
  .country.correct{fill:#3ed47d !important;stroke:#1a6f3a;stroke-width:2}
  .country.wrong{fill:#ff5a73 !important;animation:shake 0.4s;stroke:#a82339;stroke-width:2}
  .country.solved{fill:#2d6f4f;stroke:#5fd49a;stroke-width:1.4}
  @keyframes targetPulse{0%,100%{filter:drop-shadow(0 0 8px rgba(255,200,80,0.7))}50%{filter:drop-shadow(0 0 18px rgba(255,200,80,1))}}

  /* Backup hit areas for small countries (invisible) */
  .country-hit{cursor:pointer;fill:transparent;pointer-events:fill}

  .city-dot{fill:#fff;stroke:#ff6a3d;stroke-width:3;cursor:default;transition:r 0.15s,fill 0.15s;pointer-events:none}
  .city-dot.solved{fill:#3ed47d;stroke:#1a5a3a}

  .label{fill:#cfdcff;font-size:14px;pointer-events:none;font-family:inherit;font-weight:700;paint-order:stroke;stroke:#0b1530;stroke-width:3}
  .label.country{fill:#dbe7ff}
  .label.solved{fill:#bcffc7}
  .label.city{fill:#ffd0a8;font-size:13px}
  .label.feature{fill:#a0b7ff;font-size:13px;font-style:italic}
  .label.sea{fill:#7fd4ff;font-size:15px;font-style:italic}

  /* River and mountain LINES are visual only — no clicks */
  .river{fill:none;stroke:#5fb8ff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0.9;pointer-events:none}
  .river.solved{stroke:#3ed47d;stroke-width:4.2}
  .mountain{fill:none;stroke:#c79a6b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:0.9;pointer-events:none;stroke-dasharray:6 3}
  .mountain.solved{stroke:#3ed47d;opacity:1;stroke-width:6}

  /* Feature TAP BUTTONS with arrows (NEW) */
  .feat-arrow{fill:none;stroke-width:3;opacity:0;transition:opacity 0.25s;pointer-events:none}
  .feat-arrow.visible{opacity:0.85}
  .feat-arrow.river{stroke:#5fb8ff}
  .feat-arrow.mountain{stroke:#c79a6b}
  .feat-arrow.solved{stroke:#3ed47d;opacity:1}

  .feat-btn{cursor:pointer;opacity:0;transition:opacity 0.25s;pointer-events:none}
  .feat-btn.visible{opacity:1;pointer-events:auto}
  .feat-btn rect{fill:rgba(11,21,48,0.92);stroke-width:3.5;transition:fill 0.15s,stroke 0.15s}
  .feat-btn.river rect{stroke:#5fb8ff}
  .feat-btn.mountain rect{stroke:#c79a6b}
  .feat-btn.pressing rect{fill:#ffd64d;stroke:#ff8a3d}
  .feat-btn.hint rect{fill:rgba(255,214,77,0.6) !important;stroke:#ffd64d !important;stroke-width:4 !important}
  .feat-btn.correct rect{fill:#3ed47d !important;stroke:#1a6f3a !important}
  .feat-btn.wrong rect{fill:#ff5a73 !important;stroke:#a82339 !important;animation:shake 0.4s}
  .feat-btn.solved{opacity:1;pointer-events:none}
  .feat-btn.solved rect{fill:rgba(62,212,125,0.35);stroke:#3ed47d}
  .feat-btn .btn-label{fill:#cfdcff;font-size:14px;font-weight:700;text-anchor:middle;pointer-events:none;opacity:0}
  .feat-btn.solved .btn-label{opacity:1;fill:#bcffc7}

  .feat-marker{fill:#ffd64d;stroke:#0b1530;stroke-width:2;opacity:0;cursor:pointer;transition:opacity 0.2s;pointer-events:none}
  .feat-marker.visible{opacity:0.5;pointer-events:auto}
  .feat-marker.hint{opacity:0.9 !important;stroke:#ffd64d;stroke-width:3}
  .feat-marker.solved{fill:#3ed47d;opacity:1}

  /* Feedback floats */
  .float-fx{position:absolute;pointer-events:none;font-size:42px;font-weight:900;text-shadow:0 4px 12px rgba(0,0,0,0.6);animation:floatUp 0.9s ease-out forwards;z-index:30}
  .float-fx.good{color:#3ed47d}
  .float-fx.bad{color:#ff8aa0}
  @keyframes floatUp{0%{transform:translate(-50%,0) scale(0.8);opacity:0}20%{transform:translate(-50%,-20px) scale(1.1);opacity:1}100%{transform:translate(-50%,-100px) scale(1);opacity:0}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  /* ===== TYPING INPUT BAR ===== */
  .input-bar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;background:rgba(0,0,0,0.78);padding:12px 16px;border-radius:18px;z-index:25;box-shadow:0 8px 24px rgba(0,0,0,0.5);max-width:90vw}
  .input-bar.on{display:flex}
  .input-bar .country-tag{font-size:20px;color:#ffd64d;padding:0 6px;min-width:80px;text-align:center}
  .input-bar input{font-size:24px;padding:10px 14px;border-radius:12px;border:3px solid #4d6dff;background:#fff;color:#000;width:260px;font-family:inherit;font-weight:700;outline:none;transition:border-color 0.15s}
  .input-bar input:focus{border-color:#ffd64d}
  .input-bar input.wrong{border-color:#ff5a73;animation:shake 0.4s}
  .input-bar input.correct{border-color:#3ed47d;background:#dffce8}
  .input-bar .btn{min-height:50px;padding:10px 20px;font-size:18px}

  /* ===== MODAL / MENU ===== */
  .overlay{position:absolute;inset:0;background:rgba(7,15,40,0.94);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px;z-index:50;animation:fadeIn 0.25s;overflow-y:auto}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .overlay h1{font-size:42px;background:linear-gradient(135deg,#ffd64d,#ff8a3d,#ff5a73);background-clip:text;-webkit-background-clip:text;color:transparent;text-align:center;margin-bottom:6px;letter-spacing:2px}
  .overlay h2{font-size:28px;color:#fff;margin-bottom:14px;text-align:center}
  .overlay p{font-size:16px;color:#9fc1ff;text-align:center;margin-bottom:14px;line-height:1.5}
  .menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:960px}
  .menu-card{position:relative;background:linear-gradient(135deg,#1c2c5e,#243a7a);border-radius:18px;padding:18px;cursor:pointer;border:2px solid rgba(255,255,255,0.08);transition:transform 0.15s,border-color 0.15s;min-height:108px;display:flex;flex-direction:column;justify-content:space-between}
  .menu-card:active{transform:scale(0.97);border-color:#ffd64d}
  .menu-card .ico{font-size:32px;margin-bottom:4px}
  .menu-card .name{font-size:20px;color:#fff;margin-bottom:3px}
  .menu-card .desc{font-size:13px;color:#9fc1ff;line-height:1.4}
  .menu-card .meta{font-size:13px;color:#ffd64d;margin-top:4px}
  .menu-card.cleared{border-color:#3ed47d}
  .menu-card.cleared::after{content:"★クリア";position:absolute;top:8px;right:12px;color:#3ed47d;font-size:13px}
  .menu-section-title{font-size:14px;color:#7fb6ff;letter-spacing:2px;margin:18px 0 8px;align-self:flex-start;max-width:960px;width:100%;text-align:left;padding-left:6px}

  .result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:640px;margin-bottom:18px}
  .stat-box{background:rgba(255,255,255,0.08);border-radius:14px;padding:14px;text-align:center}
  .stat-box .label{font-size:12px;color:#9fc1ff;margin-bottom:4px}
  .stat-box .value{font-size:30px;color:#fff;font-variant-numeric:tabular-nums}
  .stat-box .value.gold{color:#ffd64d}
  .new-best{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:8px;background:#ffd64d;color:#1a1133;font-size:14px;animation:pulse 0.8s infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
  .stars{font-size:48px;letter-spacing:6px;color:#ffd64d;text-align:center;margin:6px 0 14px}
  .stars .dim{opacity:0.25}

  .btn-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

  /* ===== TOAST ===== */
  .toast{position:absolute;top:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 18px;border-radius:12px;font-size:16px;z-index:40;animation:toastIn 0.3s,toastOut 0.3s 1.7s forwards;pointer-events:none}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes toastOut{to{opacity:0;transform:translate(-50%,-10px)}}

  /* Settings strip */
  .settings{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .toggle{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(255,255,255,0.08);border-radius:10px;cursor:pointer;font-size:14px}
  .toggle .dot{width:12px;height:12px;border-radius:50%;background:#3ed47d}
  .toggle.off .dot{background:#666}

  @media (min-width: 1000px) {
    .hud .prompt{font-size:32px}
    .hud .prompt .target{font-size:38px}
    .label{font-size:15px}
    .label.city{font-size:14px}
  }
</style>
</head>
<body>
<div id="app">
  <div class="hud" id="hud">
    <div class="title">🗺️ ヨーロッパ制覇クエスト</div>
    <div class="prompt" id="prompt">メニューからモードを選んでね</div>
    <div class="stat timer"><div class="label">タイム</div><div class="value" id="timerV">0.0</div></div>
    <div class="stat"><div class="label">スコア</div><div class="value" id="scoreV">0</div></div>
    <div class="stat streak"><div class="label">コンボ</div><div class="value" id="streakV">0</div></div>
    <div class="stat"><div class="label">残り</div><div class="value" id="remainV">-</div></div>
    <button class="btn ghost" id="menuBtn" style="display:none">メニュー</button>
  </div>
  <div id="stage">
    <svg id="map" viewBox="0 0 1400 1000" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="ah-river" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L12,6 L0,12 z" fill="#5fb8ff" />
        </marker>
        <marker id="ah-mountain" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L12,6 L0,12 z" fill="#c79a6b" />
        </marker>
        <marker id="ah-solved" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L12,6 L0,12 z" fill="#3ed47d" />
        </marker>
      </defs>
    </svg>
    <div class="input-bar" id="inputBar">
      <div class="country-tag" id="inputCountry">―</div>
      <input id="answerInput" type="text" placeholder="首都名" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="btn" id="answerBtn">答える</button>
    </div>
  </div>
</div>

<div id="overlay" class="overlay"></div>

const Sound = (() => {
  let ctx=null, enabled=true;
  function init(){
    if(!ctx){
      try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    }
    if(ctx && ctx.state === 'suspended'){
      try{ ctx.resume(); }catch(e){}
    }
  }
  function tone(freq, dur=0.12, type='sine', vol=0.18){
    if(!enabled) return;
    init();
    if(!ctx) return;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+dur);
  }
  return {
    init,
    correct(){ tone(880,0.09,'triangle'); setTimeout(()=>tone(1320,0.12,'triangle'),60); },
    wrong(){ tone(220,0.18,'sawtooth',0.14); },
    combo(n){ tone(880+n*60,0.08,'square',0.12); },
    levelup(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.14,'triangle',0.16),i*90)); },
    tick(){ tone(1500,0.04,'square',0.06); },
    toggle(){ enabled = !enabled; return enabled; },
    get enabled(){ return enabled; }
  };
})();
['touchstart','mousedown','keydown','click'].forEach(evt =>
  document.addEventListener(evt, ()=>Sound.init(), {passive:true, capture:true})
);

};

// ===== TEXT NORMALIZATION =====
function normalize(s){
  if(!s) return '';
  s = s.toString().trim();
  s = s.replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
  s = s.toUpperCase();
  s = s.replace(/[\s・\-ー‐−]+/g, '');
  return s;
}

// ===== RENDER =====
const SVG_NS = 'http://www.w3.org/2000/svg';
const map = document.getElementById('map');

function svgEl(name, attrs={}){
  const el = document.createElementNS(SVG_NS, name);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function renderMap(){
  // Remove existing dynamic children but keep <defs>
  Array.from(map.children).forEach(ch => { if(ch.tagName.toLowerCase() !== 'defs') map.removeChild(ch); });
  const data = GAME_DATA;

  const gCountries = svgEl('g', {id:'g-countries'});
  const gMountains = svgEl('g', {id:'g-mountains'});
  const gRivers = svgEl('g', {id:'g-rivers'});
  const gFeatBtns = svgEl('g', {id:'g-featbtns'});
  const gMarkers = svgEl('g', {id:'g-markers'});
  const gCountryHits = svgEl('g', {id:'g-country-hits'});
  const gCities = svgEl('g', {id:'g-cities'});
  const gLabels = svgEl('g', {id:'g-labels'});

  map.appendChild(gCountries);
  map.appendChild(gMountains);
  map.appendChild(gRivers);
  map.appendChild(gFeatBtns);
  map.appendChild(gMarkers);
  map.appendChild(gCountryHits);
  map.appendChild(gCities);
  map.appendChild(gLabels);

  state.itemNodes = {};

  // Sort countries: background first, then targets by size descending (small last → on top)
  const sorted = [...data.countries].sort((a,b) => {
    const aT = a.isTarget?1:0, bT = b.isTarget?1:0;
    if(aT !== bT) return aT - bT; // bg(0) first, target(1) later
    if(aT && bT){
      const aS = COUNTRY_SIZE[a.jp] || 5;
      const bS = COUNTRY_SIZE[b.jp] || 5;
      return bS - aS; // larger first, smaller later (on top)
    }
    return 0;
  });

  sorted.forEach(c => {
    const isTarget = !!c.isTarget;
    const cls = isTarget ? 'country target' : 'country bg';
    const path = svgEl('path', {d: c.d, class: cls, 'data-country': c.jp || c.name});
    if(isTarget){
      attachTap(path, () => onTapCountry(c.jp, path));
      state.itemNodes['country:'+c.jp] = [path];
    }
    gCountries.appendChild(path);
  });

  // Backup hit circles for small target countries (invisible, on top)
  data.countries.filter(c => c.isTarget && SMALL_COUNTRY_HIT_RADIUS[c.jp]).forEach(c => {
    const r = SMALL_COUNTRY_HIT_RADIUS[c.jp];
    const hit = svgEl('circle', {cx:c.centroid[0], cy:c.centroid[1], r, class:'country-hit', 'data-hit':c.jp});
    attachTap(hit, () => {
      const mainNode = state.itemNodes['country:'+c.jp][0];
      onTapCountry(c.jp, mainNode);
    });
    gCountryHits.appendChild(hit);
  });

  // Mountain lines (visual only, no clicks)
  data.mountains.forEach(m => {
    const d = 'M' + m.pts.map(p=>p.join(' ')).join(' L ');
    const vis = svgEl('path', {d, class:'mountain', 'data-mountain':m.name});
    gMountains.appendChild(vis);
    state.itemNodes['mountain:'+m.name] = [vis];
  });

  // River lines (visual only, no clicks)
  data.rivers.forEach(r => {
    const d = 'M' + r.pts.map(p=>p.join(' ')).join(' L ');
    const vis = svgEl('path', {d, class:'river', 'data-river':r.name});
    gRivers.appendChild(vis);
    state.itemNodes['river:'+r.name] = [vis];
  });

  // Feature buttons + arrows for rivers
  data.rivers.forEach(r => makeFeatureButton('river', r, gFeatBtns));
  data.mountains.forEach(m => makeFeatureButton('mountain', m, gFeatBtns));

  // Cities (visual only — tapping cities not used in current modes)
  data.cities.forEach(c => {
    const dot = svgEl('circle', {cx:c.pos[0], cy:c.pos[1], r:7, class:'city-dot', 'data-city':c.name});
    gCities.appendChild(dot);
    state.itemNodes['city:'+c.name] = [dot];
  });

  // Sea/Peninsula/Plain markers (yellow circles, shown only during their question)
  function makeMarker(type, name, pos, r=24){
    const circ = svgEl('circle', {cx:pos[0], cy:pos[1], r, class:'feat-marker', 'data-feat':type+':'+name});
    attachTap(circ, () => onTapFeature(type, name, circ));
    gMarkers.appendChild(circ);
    state.itemNodes[type+':'+name] = [circ];
  }
  data.peninsulas.forEach(p => makeMarker('peninsula', p.name, p.pos, 28));
  data.seas.forEach(p => makeMarker('sea', p.name, p.pos, 30));
  data.plains.forEach(p => makeMarker('plain', p.name, p.pos, 28));

  // Labels (revealed on solve)
  state.labelNodes = [];
  data.countries.filter(c=>c.isTarget).forEach(c => {
    const t = svgEl('text', {x:c.centroid[0], y:c.centroid[1], class:'label country', 'text-anchor':'middle', opacity:0});
    t.textContent = c.jp;
    gLabels.appendChild(t);
    state.labelNodes.push(['country',c.jp,t]);
  });
  data.cities.forEach(c => {
    const t = svgEl('text', {x:c.pos[0]+10, y:c.pos[1]+4, class:'label city', opacity:0});
    t.textContent = c.name;
    gLabels.appendChild(t);
    state.labelNodes.push(['city',c.name,t]);
  });
  data.peninsulas.forEach(p => {
    const t = svgEl('text', {x:p.pos[0], y:p.pos[1]+30, class:'label feature', 'text-anchor':'middle', opacity:0});
    t.textContent = p.name;
    gLabels.appendChild(t);
    state.labelNodes.push(['peninsula',p.name,t]);
  });
  data.seas.forEach(p => {
    const t = svgEl('text', {x:p.pos[0], y:p.pos[1], class:'label sea', 'text-anchor':'middle', opacity:0});
    t.textContent = p.name;
    gLabels.appendChild(t);
    state.labelNodes.push(['sea',p.name,t]);
  });
  data.plains.forEach(p => {
    const t = svgEl('text', {x:p.pos[0], y:p.pos[1]+30, class:'label feature', 'text-anchor':'middle', opacity:0});
    t.textContent = p.name;
    gLabels.appendChild(t);
    state.labelNodes.push(['plain',p.name,t]);
  });
}

function makeFeatureButton(type, feat, parentG){
  const mid = feat.pts[Math.floor(feat.pts.length/2)];
  const btnPos = FEATURE_BTN_POS[feat.name];
  if(!btnPos){ console.warn('No button pos for', feat.name); return; }
  // Arrow direction: button → mid
  const dx = mid[0] - btnPos[0], dy = mid[1] - btnPos[1];
  const dist = Math.sqrt(dx*dx + dy*dy);
  const halfSize = 36;
  // Start arrow just outside button edge
  const sx = btnPos[0] + dx/dist * halfSize;
  const sy = btnPos[1] + dy/dist * halfSize;
  // End arrow slightly before the line to leave a gap
  const ex = mid[0] - dx/dist * 8;
  const ey = mid[1] - dy/dist * 8;
  const arrow = svgEl('line', {
    x1:sx, y1:sy, x2:ex, y2:ey,
    class:'feat-arrow ' + type,
    'marker-end':'url(#ah-' + type + ')'
  });
  parentG.appendChild(arrow);
  // Button group
  const g = svgEl('g', {
    class:'feat-btn ' + type,
    transform: `translate(${btnPos[0]},${btnPos[1]})`,
    'data-feat': type+':'+feat.name
  });
  const rect = svgEl('rect', {x:-36, y:-36, width:72, height:72, rx:12});
  g.appendChild(rect);
  const lbl = svgEl('text', {x:0, y:6, class:'btn-label'});
  // Shortened label shown only when solved
  lbl.textContent = feat.name.replace('山脈','').replace('川','');
  g.appendChild(lbl);
  attachTap(g, () => onTapFeature(type, feat.name, g));
  parentG.appendChild(g);
  // Add to itemNodes (line, button group, arrow)
  state.itemNodes[type+':'+feat.name].push(g, arrow);
}

function attachTap(el, fn){
  let pressing = false;
  el.addEventListener('touchstart', e => {
    e.preventDefault();
    pressing = true;
    el.classList.add('pressing');
    Sound.init();
  }, {passive:false});
  el.addEventListener('touchend', e => {
    e.preventDefault();
    const wasPressing = pressing;
    pressing = false;
    el.classList.remove('pressing');
    if(wasPressing) fn(e);
  }, {passive:false});
  el.addEventListener('touchcancel', () => {
    pressing = false;
    el.classList.remove('pressing');
  });
  el.addEventListener('click', e => fn(e));
}

function getLabelNode(type, name){
  const e = state.labelNodes.find(x => x[0]===type && x[1]===name);
  return e ? e[2] : null;
}

// ===== GAME LOGIC =====
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function startStage(stageId){
  const stage = STAGES.find(s=>s.id===stageId);
  if(!stage) return;
  state.mode = stage.boss ? 'boss' : 'quest';
  state.stageId = stageId;
  setViewBox(stage.viewBox || VB_ALL);
  const items = stage.items || buildBossItems();
  state.queue = shuffle(items);
  state.total = state.queue.length;
  state.score = 0; state.streak = 0; state.maxStreak = 0; state.mistakes = 0;
  state.elapsed = 0; state.startedAt = performance.now();
  hideOverlay();
  resetMapVisual();
  document.getElementById('menuBtn').style.display = 'inline-flex';
  startTimer();
  Sound.init();
  next();
}

function startTimeAttack(){
  state.mode = 'attack';
  state.stageId = 'attack';
  setViewBox(VB_ALL);
  state.queue = shuffle(countryItems(ALL_COUNTRIES));
  state.total = state.queue.length;
  state.score = 0; state.streak = 0; state.maxStreak = 0; state.mistakes = 0;
  state.elapsed = 0; state.startedAt = performance.now();
  hideOverlay();
  resetMapVisual();
  document.getElementById('menuBtn').style.display = 'inline-flex';
  startTimer();
  Sound.init();
  next();
}

function startPractice(){

  state.stageId = 'practice';
  setViewBox(VB_ALL);
  state.queue = shuffle(buildBossItems());
  state.total = state.queue.length;
  state.score = 0; state.streak = 0; state.maxStreak = 0; state.mistakes = 0;
  state.elapsed = 0; state.startedAt = performance.now();
  hideOverlay();
  resetMapVisual();
  document.getElementById('menuBtn').style.display = 'inline-flex';
  startTimer();

  next();

function resetMapVisual(){
  map.querySelectorAll('.country').forEach(p => p.classList.remove('solved','hint','correct','wrong','target-highlight','pressing'));
  map.querySelectorAll('.city-dot').forEach(p => p.classList.remove('solved'));
  map.querySelectorAll('.river').forEach(p => p.classList.remove('solved'));
  map.querySelectorAll('.mountain').forEach(p => p.classList.remove('solved'));
  map.querySelectorAll('.feat-marker').forEach(p => p.classList.remove('solved','visible','hint','correct','wrong'));
  map.querySelectorAll('.feat-btn').forEach(p => p.classList.remove('solved','visible','hint','correct','wrong','pressing'));
  map.querySelectorAll('.feat-arrow').forEach(p => p.classList.remove('solved','visible'));
  state.labelNodes.forEach(([_,__,t]) => t.setAttribute('opacity',0));
  hideInputBar();
}

function next(){
  if(state.queue.length === 0){ finish(); return; }
  state.current = state.queue[0];
  state.hintUsed = false;
  showPrompt();
  showRelevantMarkers();
  setupTypingIfNeeded();
}

function showRelevantMarkers(){
  // Hide all selectables
  map.querySelectorAll('.feat-marker').forEach(el => {
    if(!el.classList.contains('solved')) el.classList.remove('visible');
  });
  map.querySelectorAll('.feat-btn').forEach(el => {
    if(!el.classList.contains('solved')) el.classList.remove('visible');
  });
  map.querySelectorAll('.feat-arrow').forEach(el => {
    if(!el.classList.contains('solved')) el.classList.remove('visible');
  });

  const c = state.current;
  // Sea/peninsula/plain markers
  if(['sea','peninsula','plain'].includes(c.type)){
    const data = GAME_DATA;
    let list = data.seas;
    if(c.type==='peninsula') list = data.peninsulas;
    if(c.type==='plain') list = data.plains;
    list.forEach(p => {
      const nodes = state.itemNodes[c.type+':'+p.name];
      if(nodes) nodes.forEach(n => { if(!n.classList.contains('solved')) n.classList.add('visible'); });
    });
  }
  // River buttons during river question
  if(c.type === 'river'){
    GAME_DATA.rivers.forEach(r => {
      const nodes = state.itemNodes['river:'+r.name] || [];
      nodes.forEach(n => {
        if(n.classList.contains('feat-btn') || n.classList.contains('feat-arrow')){
          if(!n.classList.contains('solved')) n.classList.add('visible');
        }
      });
    });
  }
  // Mountain buttons during mountain question
  if(c.type === 'mountain'){
    GAME_DATA.mountains.forEach(m => {
      const nodes = state.itemNodes['mountain:'+m.name] || [];
      nodes.forEach(n => {
        if(n.classList.contains('feat-btn') || n.classList.contains('feat-arrow')){
          if(!n.classList.contains('solved')) n.classList.add('visible');
        }
      });
    });
  }
}

function showPrompt(){
  const c = state.current;
  let label = '';
  switch(c.type){
    case 'country': label = `<span class="target">${c.name}</span>はどこ？`; break;
    case 'capital_typed': label = `光った国の首都をタイプ！`; break;
    case 'river': label = `<span class="target">${c.name}</span>はどれ？　矢印の四角をタップ`; break;
    case 'mountain': label = `<span class="target">${c.name}</span>はどこ？　矢印の四角をタップ`; break;
    case 'sea':
    case 'peninsula':
    case 'plain': label = `<span class="target">${c.name}</span>はどこ？`; break;
    default: label = `<span class="target">${c.name}</span>`;
  }
  document.getElementById('prompt').innerHTML = label;
  updateHUD();
}

function updateHUD(){
  document.getElementById('scoreV').textContent = state.score;
  document.getElementById('streakV').textContent = state.streak;
  document.getElementById('remainV').textContent = state.queue.length;
}

function startTimer(){
  cancelAnimationFrame(state.timerRAF);
  function tick(){
    state.elapsed = (performance.now() - state.startedAt)/1000;
    document.getElementById('timerV').textContent = state.elapsed.toFixed(1);
    state.timerRAF = requestAnimationFrame(tick);
  }
  tick();
}
function stopTimer(){ cancelAnimationFrame(state.timerRAF); }

// ===== TYPING MODE =====
function setupTypingIfNeeded(){
  const c = state.current;
  map.querySelectorAll('.target-highlight').forEach(n => n.classList.remove('target-highlight'));
  if(c && c.type==='capital_typed'){
    const nodes = state.itemNodes['country:'+c.country];
    if(nodes) nodes.forEach(n => n.classList.add('target-highlight'));
    showInputBar(c.country);
  } else {
    hideInputBar();
  }
}

function showInputBar(country){
  const bar = document.getElementById('inputBar');
  document.getElementById('inputCountry').textContent = country + ' の首都？';
  bar.classList.add('on');
  const inp = document.getElementById('answerInput');
  inp.value = '';
  inp.classList.remove('wrong','correct');
  setTimeout(() => { try{ inp.focus(); }catch(e){} }, 80);
}
function hideInputBar(){
  document.getElementById('inputBar').classList.remove('on');
  const inp = document.getElementById('answerInput');
  try{ inp.blur(); }catch(e){}
}

function submitTypedAnswer(){
  const c = state.current;
  if(!c || c.type !== 'capital_typed') return;
  const inp = document.getElementById('answerInput');
  const val = inp.value;
  if(!val.trim()) return;
  const ans = normalize(val);
  const accepted = (c.answers || [c.name]).map(normalize);
  const node = state.itemNodes['country:'+c.country] ? state.itemNodes['country:'+c.country][0] : null;
  if(accepted.includes(ans)){
    inp.classList.add('correct');
    inp.classList.remove('wrong');
    setTimeout(() => inp.classList.remove('correct'), 300);
    if(node) node.classList.remove('target-highlight');
    correctAnswer(node);
  } else {
    inp.classList.add('wrong');
    setTimeout(() => inp.classList.remove('wrong'), 400);
    Sound.wrong();
    state.streak = 0;
    state.mistakes++;
    updateHUD();
    if(state.mistakes >= 2 && !state.hintUsed){
      state.hintUsed = true;
      toast('💡 ヒント：' + c.name);
    }
    floatFx('×', 'bad', inp);
  }
}

// ===== TAP HANDLERS =====
function onTapCountry(name, node){
  if(!state.current) return;
  const c = state.current;
  if(c.type==='country' && c.name===name){
    correctAnswer(node);
  } else {
    if(c.type==='capital_typed'){
      toast('キーボードで首都名をタイプしてね');
      return;
    }
    wrongAnswer(node);
  }
}
function onTapFeature(type, name, visualNode){
  if(!state.current) return;
  const c = state.current;
  if(c.type===type && c.name===name){
    correctAnswer(visualNode);
  } else {
    wrongAnswer(visualNode);
  }
}

// ===== CORRECT / WRONG =====
function correctAnswer(visualNode){
  const c = state.current;
  Sound.correct();
  state.streak++;
  state.maxStreak = Math.max(state.streak, state.maxStreak);
  const base = 10;
  const bonus = Math.floor(state.streak * 2);
  const speedBonus = state.mistakes===0 ? 5 : 0;
  state.score += base + bonus + speedBonus;
  if(state.streak >= 3 && state.streak % 3 === 0) Sound.combo(state.streak);

  // Find all related nodes for the current item
  const key = c.type === 'capital_typed' ? 'country:'+c.country : c.type+':'+c.name;
  const nodes = state.itemNodes[key] || [];
  nodes.forEach(n => {
    n.classList.remove('target-highlight','visible','hint','wrong');
    n.classList.add('correct');
  });
  setTimeout(() => {
    nodes.forEach(n => {
      n.classList.remove('correct');
      n.classList.add('solved');
    });
  }, 350);

  // Reveal label(s)
  const labelType = c.type==='capital_typed' ? 'country' : c.type;
  const labelName = c.type==='capital_typed' ? c.country : c.name;
  const lbl = getLabelNode(labelType, labelName);
  if(lbl){ lbl.setAttribute('opacity', 1); lbl.classList.add('solved'); }
  if(c.type === 'capital_typed'){
    const cityLbl = getLabelNode('city', c.name);
    if(cityLbl){ cityLbl.setAttribute('opacity', 1); cityLbl.classList.add('solved'); }
    const cityNode = state.itemNodes['city:'+c.name];
    if(cityNode) cityNode[0].classList.add('solved');
  }

  floatFx('+' + (base+bonus+speedBonus), 'good', visualNode);

  state.queue.shift();
  state.mistakes = 0;
  setTimeout(next, 450);
}

function wrongAnswer(node){
  Sound.wrong();
  state.streak = 0;
  state.mistakes++;
  if(node){
    node.classList.add('wrong');
    setTimeout(()=>node.classList.remove('wrong'), 400);
  }
  floatFx('×', 'bad', node);
  updateHUD();
  if(state.mistakes >= 2 && !state.hintUsed){
    showHint();
  }
}

function showHint(){
  state.hintUsed = true;
  const c = state.current;
  if(c.type==='capital_typed'){
    toast('💡 ヒント：' + c.name);
    return;
  }
  const key = c.type+':'+c.name;
  const nodes = state.itemNodes[key] || [];
  nodes.forEach(n => n.classList.add('hint'));
  setTimeout(()=>{ nodes.forEach(n => n.classList.remove('hint')); }, 1500);
  if(c.type==='river' || c.type==='mountain'){
    toast('💡 黄色く光ったボックスをタップ！');
  } else {
    toast('💡 黄色いところだよ！');
  }
}

function floatFx(text, kind, node){
  let x = window.innerWidth/2, y = window.innerHeight/2;
  if(node && node.getBoundingClientRect){
    const r = node.getBoundingClientRect();
    x = r.left + r.width/2;
    y = r.top + r.height/2;
  }
  const el = document.createElement('div');
  el.className = 'float-fx ' + kind;
  el.textContent = text;
  el.style.left = x+'px'; el.style.top = y+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 900);
}

function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.getElementById('app').appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

// ===== FINISH =====
function finish(){
  stopTimer();
  state.current = null;
  hideInputBar();
  document.getElementById('prompt').textContent = 'クリア！🎉';
  const time = state.elapsed;
  const stars = computeStars(time);
  const s = Store.get();
  const key = state.stageId;
  let newBest = false;
  if(state.mode !== 'practice'){
    if(!s.best[key] || time < s.best[key]) { s.best[key] = time; newBest = true; }
    if(!s.stages[key] || stars > s.stages[key]) s.stages[key] = stars;
    s.totalPlay = (s.totalPlay||0)+1;
    Store.save(s);
  }
  Sound.levelup();
  showResult({time, score:state.score, maxStreak:state.maxStreak, stars, newBest});
}

function computeStars(time){
  const perItem = time / Math.max(1, state.total);
  const hasTyping = state.mode==='boss' || state.stageId==='s5';
  const threshold3 = hasTyping ? 6 : 4;
  const threshold2 = hasTyping ? 9 : 6;
  if(perItem < threshold3) return 3;
  if(perItem < threshold2) return 2;
  return 1;
}

    </div>
  `);
  document.querySelectorAll('.menu-card[data-stage]').forEach(el => {
    el.addEventListener('click', () => { Sound.init(); startStage(el.dataset.stage); });
  });
  document.querySelectorAll('.menu-card[data-mode="attack"]').forEach(el => el.addEventListener('click', () => { Sound.init(); startTimeAttack(); }));
  document.querySelectorAll('.menu-card[data-mode="practice"]').forEach(el => el.addEventListener('click', () => { Sound.init(); startPractice(); }));
  document.getElementById('soundT').addEventListener('click', e => {
    const on = Sound.toggle();
    e.currentTarget.classList.toggle('off', !on);
    if(on) Sound.tick();
  });
  document.getElementById('resetT').addEventListener('click', () => {
    if(confirm('ベストタイムや星をすべて消してもいい？')){
      localStorage.removeItem(STORE_KEY);
      showMenu();
    }
  });
}

function showResult({time, score, maxStreak, stars, newBest}){
  const stageName = STAGES.find(s=>s.id===state.stageId)?.name || (state.mode==='attack'?'タイムアタック':'練習');
  const starsHtml = '<span>' + '★'.repeat(stars) + '<span class="dim">'+'★'.repeat(3-stars)+'</span></span>';
  showOverlay(`
    <h1>クリア！</h1>
    <h2>${stageName}</h2>
    <div class="stars">${starsHtml}</div>
    <div class="result-stats">
      <div class="stat-box"><div class="label">タイム</div><div class="value gold">${time.toFixed(1)}<span style="font-size:18px">秒</span></div>${newBest?'<div class="new-best">🏆 ベスト更新！</div>':''}</div>
      <div class="stat-box"><div class="label">スコア</div><div class="value">${score}</div></div>
      <div class="stat-box"><div class="label">最大コンボ</div><div class="value">${maxStreak}</div></div>
    </div>
    <div class="btn-row">
      <button class="btn" id="againBtn">もう一回</button>
      <button class="btn ghost" id="menuBtn2">メニューへ</button>
    </div>
  `);
  document.getElementById('againBtn').addEventListener('click', () => {
    if(state.mode==='boss' || state.mode==='quest') startStage(state.stageId);
    else if(state.mode==='attack') startTimeAttack();
    else startPractice();
  });
  document.getElementById('menuBtn2').addEventListener('click', showMenu);
}

document.getElementById('menuBtn').addEventListener('click', () => {
  if(confirm('メニューに戻る？（途中のスコアは保存されません）')) showMenu();
});
document.getElementById('answerBtn').addEventListener('click', submitTypedAnswer);
document.getElementById('answerInput').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); submitTypedAnswer(); }
});

// Init
renderMap();
showMenu();
</script>
</body>
</html>
